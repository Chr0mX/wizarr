<div class="space-y-6">
  <div>
    <h2 class="text-xl font-semibold text-gray-900 dark:text-white">{{ _("Jellyfin Policy Templates") }}</h2>
    <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">{{ _("Create reusable Jellyfin tag policies for invitations.") }}</p>
  </div>

  {% if message %}
    <div class="p-3 rounded-lg text-sm {% if level == 'success' %}bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200{% elif level == 'error' %}bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200{% else %}bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200{% endif %}">
      {{ message }}
    </div>
  {% endif %}

  <form class="grid gap-4 p-4 bg-white border border-gray-200 rounded-lg dark:bg-gray-800 dark:border-gray-700"
        hx-post="{{ url_for('settings.create_jellyfin_policy_template') }}"
        hx-target="#tab-body"
        hx-swap="innerHTML">
    <h3 class="font-medium text-gray-900 dark:text-white">{{ _("Create Template") }}</h3>
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">{{ _("Template Name") }}</label>
      <input name="name" required class="mt-1 w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">{{ _("Allowed Tags") }}</label>
      <input name="allowed_tags" placeholder="kids, family-safe" class="mt-1 w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">{{ _("Blocked Tags") }}</label>
      <input name="blocked_tags" placeholder="nsfw, 18+" class="mt-1 w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
    </div>
    <div>
      <button type="submit" class="rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-white hover:bg-primary_hover">{{ _("Create") }}</button>
    </div>
  </form>

  <div class="space-y-4">
    {% for template in templates %}
      <form class="p-4 bg-white border border-gray-200 rounded-lg dark:bg-gray-800 dark:border-gray-700 space-y-3"
            hx-post="{{ url_for('settings.update_jellyfin_policy_template', template_id=template.id) }}"
            hx-target="#tab-body"
            hx-swap="innerHTML">
        <div class="flex items-start justify-between gap-3">
          <div class="grow grid gap-3">
            <div>
              <label class="block text-xs font-medium uppercase tracking-wide text-gray-500 dark:text-gray-400">{{ _("Template Name") }}</label>
              <input name="name" value="{{ template.name }}" required class="mt-1 w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>
            <div>
              <label class="block text-xs font-medium uppercase tracking-wide text-gray-500 dark:text-gray-400">{{ _("Allowed Tags") }}</label>
              <input name="allowed_tags" value="{{ (template.allowed_tags or [])|join(', ') }}" class="mt-1 w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>
            <div>
              <label class="block text-xs font-medium uppercase tracking-wide text-gray-500 dark:text-gray-400">{{ _("Blocked Tags") }}</label>
              <input name="blocked_tags" value="{{ (template.blocked_tags or [])|join(', ') }}" class="mt-1 w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>
          </div>
          <div class="flex flex-col gap-2">
            <button type="submit" class="rounded-lg bg-primary px-3 py-2 text-xs font-semibold text-white hover:bg-primary_hover">{{ _("Save") }}</button>
            <button type="button"
                    hx-post="{{ url_for('settings.delete_jellyfin_policy_template', template_id=template.id) }}"
                    hx-target="#tab-body"
                    hx-swap="innerHTML"
                    hx-confirm="{{ _('Delete this template?') }}"
                    class="rounded-lg bg-red-600 px-3 py-2 text-xs font-semibold text-white hover:bg-red-700">{{ _("Delete") }}</button>
          </div>
        </div>
      </form>
    {% else %}
      <div class="p-4 text-sm text-gray-500 bg-white border border-gray-200 rounded-lg dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400">
        {{ _("No policy templates configured yet.") }}
      </div>
    {% endfor %}
  </div>
</div>
